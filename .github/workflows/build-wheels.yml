name: Build Wheels 

on:
  workflow_dispatch: 

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]

    steps:
      - uses: actions/checkout@v5

      # Used to host cibuildwheel
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build wheels
        run: uv build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: ankiminingassistant-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./dist/*.whl
