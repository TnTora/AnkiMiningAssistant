name: Build Wheels 

on:
  workflow_dispatch: 

jobs:
  build_wheels:
    name: Build wheels
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup environment
        run: uv sync

      - name: Build wheels
        run: uv build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-general
          path: ./dist/*.whl
